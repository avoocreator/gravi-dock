[package]
name = "nobi-island"
version = "0.1.0"
description = "Nobi Dynamic Island — AI desktop & CLI monitor, GitHub, Google Calendar, Chat, Media & Pomodoro for Windows and Linux"
authors = ["Nobi Island Contributors"]
edition = "2021"

[lib]
name = "nobi_island_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
sysinfo = "0.33"
keyring = "3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
