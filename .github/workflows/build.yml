name: build
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (core + hook)
        run: cargo test -p island-core -p gravi-hook
      - name: Build release
        run: cargo build --release
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          Compress-Archive target/release/gravi-island.exe,target/release/gravi-hook.exe,README.md dist/GraviIsland-portable.zip -Force
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\gravi-island.iss
      - uses: actions/upload-artifact@v4
        with:
          name: GraviIsland
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: dist/* }
