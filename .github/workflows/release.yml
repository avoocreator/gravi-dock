name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            hook-cli -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build installer (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: npm run pack

      - name: Upload installer artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gravi-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Build and publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Gravi ${{ github.ref_name }}"
          releaseBody: |
            Installer Windows 64-bit (NSIS) untuk Gravi ${{ github.ref_name }}.

            Cara pakai:
            1. Unduh file `Gravi_*_x64-setup.exe` di bawah.
            2. Jalankan installer (tidak memerlukan hak Administrator).
            3. Jika muncul peringatan Windows SmartScreen karena installer belum ditandatangani sertifikat berbayar, klik **More info** lalu **Run anyway**.
          releaseDraft: false
          prerelease: false
