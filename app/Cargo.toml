[package]
name = "gravi-dock"
version = "0.5.0"
edition = "2021"
description = "Gravi Dock: Multi-dock Dynamic Island & AI companion for Windows (Rust + Slint)."
build = "build.rs"

[[bin]]
name = "gravi-dock"
path = "src/main.rs"

[dependencies]
island-core = { path = "../core" }
slint = { version = "1.8", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }

[build-dependencies]
slint-build = "1.8"
